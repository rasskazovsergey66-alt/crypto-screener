name: Scrape Crypto Data

on:
  schedule:
    - cron: '0 10 * * *'      # Ежедневно в 10:00 UTC
  workflow_dispatch:          # Ручной запуск

jobs:
  scrape:
    runs-on: ubuntu-22.04     # Стабильная LTS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py
        timeout-minutes: 5     # Защита от зависания

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-data
          path: crypto_screener_*.csv

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Проверяем, есть ли CSV-файлы
          if ls crypto_screener_*.csv 1> /dev/null 2>&1; then
            # Принудительно добавляем даже игнорируемые файлы
            git add -f crypto_screener_*.csv
            git diff --staged --quiet || git commit -m "📊 Update crypto data [skip ci]"
            git push
          else
            echo "No CSV files to commit"
          fi