name: Scrape Crypto Data

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6           # <-- Обновлено с v5 на v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Clean up old CSV files
        run: python cleanup.py

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v6        # <-- Обновлено с v4 на v6
        with:
          name: crypto-data
          path: crypto_screener_*.csv

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if ls crypto_screener_*.csv 1> /dev/null 2>&1; then
            git add -f crypto_screener_*.csv
            git diff --staged --quiet || git commit -m "📊 Update crypto data [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          else
            echo "No CSV files to commit"
          fi