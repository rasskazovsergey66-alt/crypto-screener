name: Scrape Crypto Data

on:
  schedule:
    - cron: '0 4,16 * * *'          # 4:00 и 16:00 UTC = 9:00 и 21:00 Екатеринбург
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Remove old CSV files (local and from Git)
        run: |
          TODAY=$(date +%Y%m%d)
          echo "Сегодня: $TODAY"

          # Удаляем локальные файлы (кроме сегодняшнего)
          for f in crypto_screener_*.csv; do
            if [[ -f "$f" && "$f" != *"$TODAY"* ]]; then
              echo "Удаляем локально: $f"
              rm -f "$f"
            fi
          done

          # Удаляем из Git все CSV-файлы, кроме сегодняшнего
          for f in $(git ls-files -- 'crypto_screener_*.csv'); do
            if [[ "$f" != *"$TODAY"* ]]; then
              echo "Удаляем из Git: $f"
              git rm -f "$f" || true
            fi
          done

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v6
        with:
          name: crypto-data
          path: crypto_screener_*.csv

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if ls crypto_screener_*.csv 1> /dev/null 2>&1; then
            git add -f crypto_screener_*.csv
            git diff --staged --quiet || git commit -m "📊 Update crypto data [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          else
            echo "No CSV files to commit"
          fi