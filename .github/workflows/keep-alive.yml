name: Keep repository active

on:
  schedule:
    - cron: '0 12 1 * *'   # 1-го числа каждого месяца
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-22.04
    timeout-minutes: 2      # жёсткий лимит, чтобы не висел
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create empty commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Явно устанавливаем URL с токеном для push
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Создаём пустой коммит, если нет изменений – ничего не делаем
          git commit --allow-empty -m "Keep-alive commit [skip ci]" || echo "No new commit needed"
          # Пытаемся запушить, игнорируем ошибки, чтобы не сломать workflow
          git push origin || echo "Push failed, but continuing"