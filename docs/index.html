<!DOCTYPE html>
<html>
<body>
    <button onclick="runWorkflow()">Запустить парсер</button>
    <div id="status"></div>
    <script>
        const TOKEN = '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';  // замените на реальный
        const OWNER = 'rasskazovsergey66-alt';
        const REPO = 'crypto-screener';
        const WORKFLOW = 'scrape-crypto.yml';

        async function runWorkflow() {
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`;
            const resp = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${TOKEN}`,   // или Bearer
                    'Accept': 'application/vnd.github.v3+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                },
                body: JSON.stringify({ ref: 'main' })
            });
            const status = document.getElementById('status');
            if (resp.ok) {
                status.innerHTML = '✅ Запущено! Файл будет через 1–2 минуты: <a href="https://raw.githubusercontent.com/rasskazovsergey66-alt/crypto-screener/main/latest_data.csv">Скачать</a>';
            } else {
                const text = await resp.text();
                status.innerText = `❌ Ошибка: ${resp.status} ${resp.statusText}\n${text}`;
            }
        }
    </script>
</body>
</html>
